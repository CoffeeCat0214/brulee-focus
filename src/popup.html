<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CoffeeCat</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="brand">
        <img src="../assets/icons/icon-48.png" alt="" width="48" height="48">
        <div>
          <h1>CoffeeCat</h1>
          <p>tab-side coffee buddy</p>
        </div>
      </header>

      <label class="toggle-row">
        <span>Show CoffeeCat</span>
        <input id="enabled" type="checkbox" role="switch">
      </label>

      <section class="focus-panel" aria-label="Focus Coffee timer">
        <div class="focus-header">
          <div>
            <h2>Focus Coffee</h2>
            <p id="timer-status">ready to brew</p>
          </div>
          <strong id="timer-display">25:00</strong>
        </div>

        <div class="coffee-progress" aria-hidden="true">
          <span class="popup-cup">
            <span id="coffee-progress-fill"></span>
          </span>
        </div>

        <div class="timer-actions">
          <button id="timer-toggle" type="button">Start</button>
          <button id="timer-refill" type="button" class="secondary">Refill</button>
        </div>
      </section>

      <section class="gatekeeper-panel" aria-label="Gentle Gatekeeper settings">
        <div>
          <h2>Gentle Gatekeeper</h2>
          <p id="gatekeeper-status">add distracting domains</p>
        </div>

        <form id="domain-form" class="domain-form">
          <input id="blocked-domain" type="text" placeholder="youtube.com" aria-label="Domain to protect">
          <button type="submit">Add</button>
        </form>

        <div id="blocked-list" class="blocked-list" aria-label="Protected domains"></div>
      </section>

      <section class="stats-panel" aria-label="Local CoffeeCat stats">
        <h2>Local stats</h2>
        <div class="stat-grid">
          <span><strong id="stat-sessions">0</strong> sessions</span>
          <span><strong id="stat-minutes">0</strong> minutes</span>
          <span><strong id="stat-cups">0</strong> cups</span>
        </div>
      </section>

      <section class="control">
        <label for="size">Size</label>
        <select id="size">
          <option value="small">Small</option>
          <option value="medium">Medium</option>
          <option value="large">Large</option>
        </select>
      </section>

      <button id="reset-position" type="button">Reset position</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
