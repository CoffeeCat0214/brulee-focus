<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CoffeeCat</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="brand">
        <img src="../assets/icons/icon-48.png" alt="" width="48" height="48">
        <div>
          <h1>CoffeeCat</h1>
          <p>tab-side coffee buddy</p>
        </div>
      </header>

      <label class="toggle-row">
        <span>Show CoffeeCat</span>
        <input id="enabled" type="checkbox" role="switch">
      </label>

      <section class="focus-panel" aria-label="Focus Coffee timer">
        <div class="focus-header">
          <div>
            <h2>Focus Coffee</h2>
            <p id="timer-status">ready to brew</p>
          </div>
          <strong id="timer-display">25:00</strong>
        </div>

        <div class="coffee-progress" aria-hidden="true">
          <span class="popup-cup">
            <span id="coffee-progress-fill"></span>
          </span>
        </div>

        <section id="brew-deck" class="brew-selector" aria-label="Brew mode">
          <button class="brew-option" type="button" data-brew-mode="espresso" aria-pressed="true">
            <strong>Espresso</strong>
            <span>25m</span>
          </button>
          <button class="brew-option" type="button" data-brew-mode="slow-pour" aria-pressed="false">
            <strong>Slow</strong>
            <span>45m</span>
          </button>
          <button class="brew-option" type="button" data-brew-mode="cold-brew" aria-pressed="false">
            <strong>Cold</strong>
            <span>90m</span>
          </button>
          <button class="brew-option" type="button" data-brew-mode="decaf" aria-pressed="false">
            <strong>Decaf</strong>
            <span>15m</span>
          </button>

          <div class="brew-detail" aria-live="polite">
            <strong id="brew-detail-title">Espresso Shot</strong>
            <p id="brew-detail-copy">Fast, contained focus with Misu watching the door.</p>
            <dl>
              <div>
                <dt>Break</dt>
                <dd id="brew-detail-break">No break</dd>
              </div>
              <div>
                <dt>Ambient</dt>
                <dd id="brew-detail-ambient">Quiet cafe hum</dd>
              </div>
              <div>
                <dt>Cat</dt>
                <dd id="brew-detail-cat">Misu keeps watch</dd>
              </div>
            </dl>
          </div>
        </section>

        <div class="timer-actions">
          <button id="timer-toggle" type="button">Start</button>
          <button id="timer-refill" type="button" class="secondary">Refill</button>
        </div>
      </section>

      <section class="stats-panel" aria-label="Local CoffeeCat stats">
        <h2>Local stats</h2>
        <div class="stat-grid">
          <span><strong id="stat-sessions">0</strong> sessions</span>
          <span><strong id="stat-minutes">0</strong> minutes</span>
          <span><strong id="stat-cups">0</strong> cups</span>
        </div>
      </section>

      <section class="control">
        <label for="size">Size</label>
        <select id="size">
          <option value="small">Small</option>
          <option value="medium">Medium</option>
          <option value="large">Large</option>
        </select>
      </section>

      <button id="reset-position" type="button">Reset position</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
